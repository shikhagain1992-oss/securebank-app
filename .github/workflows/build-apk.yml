name: Build SecureBank APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Web APK Package
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          echo "SecureBank Web APK Container Built Successfully"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureBank-App
          path: index.html
          
